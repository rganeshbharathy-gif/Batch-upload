spring:
  application:
    name: batch-upload

  # ── Datasource (Oracle) ───────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:batch_user}
    password: ${DB_PASSWORD:secret}
    driver-class-name: oracle.jdbc.OracleDriver

    hikari:
      # One connection per writer thread + a few spare for Spring Batch metadata writes.
      # Formula: threadPoolSize + 2 (for metadata)
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:4}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Oracle-specific: improves batch insert throughput
      data-source-properties:
        defaultRowPrefetch: 200
        oracle.jdbc.implicitStatementCacheSize: 20

  # ── Spring Batch ──────────────────────────────────────────────────────────
  batch:
    job:
      # Disable auto-run; BatchUploadApplication.run() drives the launch explicitly
      enabled: false
    jdbc:
      # Tables must already exist (created via schema-oracle.sql)
      initialize-schema: never

# ── Application properties ────────────────────────────────────────────────
app:
  s3:
    bucket: ${S3_BUCKET}
    key: ${S3_KEY}
    region: ${AWS_REGION:us-east-1}

  batch:
    # Rows per JDBC batch insert. Tune for Oracle: 2000–10000 is typical.
    chunk-size: ${CHUNK_SIZE:5000}
    # Local chunking writer threads within this pod.
    # Total concurrency = TOTAL_PODS x threadPoolSize.
    thread-pool-size: ${THREAD_POOL_SIZE:4}

# ── Actuator health/readiness for K8s probes ─────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# ── Logging ────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.example.batchupload: INFO
    org.springframework.batch: INFO

---
# ── Test profile: uses H2 in-memory DB instead of Oracle ─────────────────
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle
    username: sa
    password:
    driver-class-name: org.h2.Driver
  batch:
    jdbc:
      initialize-schema: always

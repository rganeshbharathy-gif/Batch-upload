spring:
  application:
    name: batch-upload

  # ── Datasource (Oracle) ───────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:batch_user}
    password: ${DB_PASSWORD:secret}
    driver-class-name: oracle.jdbc.OracleDriver

    hikari:
      # Formula: threadPoolSize * pods_per_node + 2 (for batch metadata)
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:4}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      data-source-properties:
        defaultRowPrefetch: 200
        oracle.jdbc.implicitStatementCacheSize: 20

  # ── Spring Batch 6 ────────────────────────────────────────────────────────
  batch:
    job:
      enabled: false   # ApplicationRunner launches the job explicitly
    jdbc:
      initialize-schema: never   # metadata tables provisioned via schema-oracle.sql

# ── Application properties ────────────────────────────────────────────────
app:
  file:
    path: ${FILE_PATH:/data/input.txt}

  # Header tokens as they appear in line 2 of the input file (case-insensitive match).
  columns:
    grid-id: ${COL_GRID_ID:GRID_ID}
    person-id: ${COL_PERSON_ID:CSI_ID}
    country-code: ${COL_COUNTRY_CODE:CTY_OF_CTZN_CD}
    eco-sector-code: ${COL_ECO_SECTOR_CODE:ECON_SEC_CD}

  batch:
    chunk-size: ${CHUNK_SIZE:5000}
    thread-pool-size: ${THREAD_POOL_SIZE:4}
    skip-limit: ${SKIP_LIMIT:10000}

# ── Actuator health/readiness for K8s probes ─────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# ── Logging ────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.example.batchupload: INFO
    org.springframework.batch: INFO

---
# ── Test profile: H2 in Oracle-compat mode ───────────────────────────────
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle
    username: sa
    password:
    driver-class-name: org.h2.Driver
  batch:
    jdbc:
      initialize-schema: always

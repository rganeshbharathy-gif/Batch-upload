# Disable automatic job execution on startup — the scheduler handles it
spring.batch.job.enabled=false

# Cron expression for the dimension load job (default: daily at 2 AM)
batch.schedule.cron=0 0 2 * * *

# ── Pod / Kubernetes settings ──────────────────────────────────────────────
batch.pod.index=0
batch.pod.total=1

# ── Chunk and thread-pool tuning ───────────────────────────────────────────
batch.chunk-size=5000
batch.thread-pool-size=4

# ── AWS S3 settings ────────────────────────────────────────────────────────
# ── JPA / Hibernate ──────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ── Liquibase ─────────────────────────────────────────────────────────────
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# ── AWS S3 settings ────────────────────────────────────────────────────────
aws.s3.region=us-east-1
aws.s3.bucket=my-bucket
aws.s3.key=data/dimensions.dat
